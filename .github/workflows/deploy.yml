name: Build and Deploy Scratch Editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout Scratch GUI source
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: develop
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install Scratch dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Remove Share, Backpack, and User buttons
        working-directory: scratch-gui-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove the Share button by giving it a dedicated CSS class.
          menu_file = Path("src/components/menu-bar/menu-bar.jsx")
          menu = menu_file.read_text(encoding="utf-8")

          menu, share_count = re.subn(
              r'(<ShareButton\s+className=)\{styles\.menuBarButton\}',
              r'\1{classNames(styles.menuBarButton, styles.shareButton)}',
              menu
          )

          if share_count == 0:
              raise SystemExit("Could not find the Share button in menu-bar.jsx")

          menu_file.write_text(menu, encoding="utf-8")

          # Hide Share and the right-side account/profile area.
          css_file = Path("src/components/menu-bar/menu-bar.css")
          css = css_file.read_text(encoding="utf-8")

          css += """

          /* ScratchR customizations */
          .shareButton {
              display: none !important;
          }

          .accountInfoGroup {
              display: none !important;
          }
          """

          css_file.write_text(css, encoding="utf-8")

          # Remove the Backpack component from the editor layout.
          gui_file = Path("src/components/gui/gui.jsx")
          gui = gui_file.read_text(encoding="utf-8")

          old = "{backpackVisible ? ("
          new = "{false && backpackVisible ? ("

          if gui.count(old) != 1:
              raise SystemExit("Could not find the Backpack visibility condition")

          gui_file.write_text(
              gui.replace(old, new, 1),
              encoding="utf-8"
          )

          print("Share, Backpack, and account controls patched.")
          PY

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p site/editor
          cp index.html site/index.html
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll
          touch site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
