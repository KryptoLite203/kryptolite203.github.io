
name: Build and Deploy Scratch Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check sprite file
        run: |
          test -f Sprite1.sprite3 || {
            echo "Sprite1.sprite3 is missing from the repository root."
            exit 1
          }

      - name: Checkout Scratch GUI
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: develop
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Customize Scratch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          import re
          import shutil

          root = Path("scratch-gui-src")
          default = root / "src/lib/default-project"

          # Read the exported Scratch sprite.
          with zipfile.ZipFile("Sprite1.sprite3") as archive:
              names = archive.namelist()

              if "sprite.json" not in names:
                  raise RuntimeError("sprite.json is missing from Sprite1.sprite3")

              sprite = json.loads(archive.read("sprite.json"))

              if sprite.get("isStage"):
                  raise RuntimeError("Sprite1.sprite3 contains a Stage, not a sprite.")

              asset_folder = default / "custom-sprite"
              if asset_folder.exists():
                  shutil.rmtree(asset_folder)
              asset_folder.mkdir(parents=True)

              assets = []
              for item in sprite.get("costumes", []) + sprite.get("sounds", []):
                  filename = item.get("md5ext")
                  if not filename or filename not in names:
                      raise RuntimeError(f"Missing sprite asset: {filename}")

                  safe_name = Path(filename).name
                  (asset_folder / safe_name).write_bytes(archive.read(filename))

                  assets.append({
                      "item": item,
                      "filename": safe_name
                  })

          # Generate a JavaScript module containing the complete sprite,
          # including its scripts, costumes, sounds, and properties.
          (default / "custom-sprite.js").write_text(
              "export default " + json.dumps(sprite, ensure_ascii=False) + ";\n",
              encoding="utf-8"
          )

          # Keep Scratch's original Stage, but replace its default sprite.
          data_file = default / "project-data.js"
          data = data_file.read_text(encoding="utf-8")

          original_function = "const projectData = translateFunction => {"
          if data.count(original_function) != 1:
              raise RuntimeError("Unexpected project-data.js structure.")

          data = data.replace(
              original_function,
              "const baseProjectData = translateFunction => {",
              1
          )

          export_line = "export default projectData;"
          if data.count(export_line) != 1:
              raise RuntimeError("Could not locate project-data.js export.")

          wrapper = """
          import customSprite from './custom-sprite';

          const projectData = translateFunction => {
              const data = baseProjectData(translateFunction);
              data.targets = data.targets.filter(target => target.isStage);
              data.targets.push(customSprite);
              return data;
          };

          export default projectData;
          """

          data = data.replace(export_line, wrapper.strip(), 1)
          data_file.write_text(data, encoding="utf-8")

          # Register all custom costume and sound assets with Scratch.
          index_file = default / "index.js"
          index = index_file.read_text(encoding="utf-8")

          marker = "const defaultProject = translator =>"
          if index.count(marker) != 1:
              raise RuntimeError("Unexpected default-project index.js structure.")

          imports = []
          entries = []

          for number, asset in enumerate(assets):
              item = asset["item"]
              filename = asset["filename"]
              fmt = item.get("dataFormat", "").lower()
              asset_id = item.get("assetId")

              if not asset_id:
                  raise RuntimeError("A custom asset has no assetId.")

              variable = f"customAsset{number}"
              relative = f"./custom-sprite/{filename}"

              if fmt == "svg":
                  imports.append(
                      f"import {variable} from '!raw-loader!{relative}?';"
                  )
                  asset_type = "ImageVector"
                  asset_data = f"encoder.encode({variable})"
                  output_format = "SVG"

              elif fmt == "wav":
                  imports.append(
                      f"import {variable} from '!arraybuffer-loader!{relative}?';"
                  )
                  asset_type = "Sound"
                  asset_data = f"new Uint8Array({variable})"
                  output_format = "WAV"

              else:
                  raise RuntimeError(
                      f"Unsupported custom asset format: {fmt}"
                  )

              entries.append(
                  "{ id: " + json.dumps(asset_id) +
                  ", assetType: " + json.dumps(asset_type) +
                  ", dataFormat: " + json.dumps(output_format) +
                  ", data: " + asset_data + " }"
              )

          index = index.replace(
              marker,
              "\n".join(imports) + "\n\n" + marker,
              1
          )

          # Insert before the final closing bracket of the asset array.
          array_end = index.rfind("];")
          if array_end == -1:
              raise RuntimeError("Could not locate the default asset array.")

          index = (
              index[:array_end].rstrip()
              + ",\n"
              + ",\n".join(entries)
              + "\n"
              + index[array_end:]
          )

          index_file.write_text(index, encoding="utf-8")

          # Remove Share and See Project Page buttons.
          menu_file = root / "src/components/menu-bar/menu-bar.jsx"
          menu = menu_file.read_text(encoding="utf-8")

          menu, share_count = re.subn(
              r"<ShareButton\b[\s\S]*?/>",
              "<></>",
              menu
          )
          menu, community_count = re.subn(
              r"<CommunityButton\b[\s\S]*?/>",
              "<></>",
              menu
          )

          if share_count == 0:
              raise RuntimeError("Could not find the Share button.")
          if community_count == 0:
              raise RuntimeError("Could not find the See Project Page button.")

          menu_file.write_text(menu, encoding="utf-8")

          # Hide Backpack without changing the editor's other panels.
          gui_file = root / "src/components/gui/gui.jsx"
          gui = gui_file.read_text(encoding="utf-8")

          if "{backpackVisible ? (" not in gui:
              raise RuntimeError("Could not find the Backpack display section.")

          gui = gui.replace(
              "{backpackVisible ? (",
              "{false && backpackVisible ? (",
              1
          )
          gui_file.write_text(gui, encoding="utf-8")

          # Blue top bar and hidden account/user controls.
          css_file = root / "src/components/menu-bar/menu-bar.css"

          css = """
          /* Custom blue Scratch top bar */
          .menu-bar {
              background-color: #1677d2 !important;
          }

          .menu-bar .menu-bar-item.active,
          .menu-bar .menu-bar-item.hoverable:hover {
              background-color: #105da8 !important;
          }

          /* Keep save status, hide account and user controls */
          .account-info-group > :not(:first-child) {
              display: none !important;
          }
          """

          with css_file.open("a", encoding="utf-8") as file:
              file.write("\n" + css + "\n")

          print("Custom sprite:", sprite.get("name", "Unnamed"))
          print("Costumes:", len(sprite.get("costumes", [])))
          print("Sounds:", len(sprite.get("sounds", [])))
          print("Share and community buttons removed.")
          print("Backpack hidden.")
          print("Blue top bar applied.")
          PY

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p site/editor
          cp index.html site/index.html
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll
          touch site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
