name: Build and Deploy Scratch Editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout Scratch GUI source
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: develop
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install Scratch dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p site/editor
          cp index.html site/index.html
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll
          touch site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
