
name: Build and Deploy Scratch Editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check custom sprite
        run: |
          if [ ! -f Sprite1.sprite3 ]; then
            echo "ERROR: Sprite1.sprite3 must be in the repository root."
            exit 1
          fi

      - name: Checkout Scratch GUI source
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: develop
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install Scratch dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Customize Scratch Editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import zipfile
          import shutil

          root = Path("scratch-gui-src")
          sprite_file = Path("Sprite1.sprite3")

          # --------------------------------------------------
          # 1. Read the exported Scratch sprite.
          # --------------------------------------------------

          with zipfile.ZipFile(sprite_file, "r") as archive:
              names = archive.namelist()

              if "project.json" not in names:
                  raise RuntimeError(
                      "Sprite1.sprite3 does not contain project.json."
                  )

              project = json.loads(
                  archive.read("project.json").decode("utf-8")
              )

              sprites = [
                  target for target in project.get("targets", [])
                  if not target.get("isStage", False)
              ]

              if not sprites:
                  raise RuntimeError(
                      "No sprite was found inside Sprite1.sprite3."
                  )

              sprite = sprites[0]

              asset_dir = root / "src/lib/default-project/custom-sprite"
              if asset_dir.exists():
                  shutil.rmtree(asset_dir)
              asset_dir.mkdir(parents=True)

              asset_files = {}

              for target in sprites:
                  for item in target.get("costumes", []) + target.get("sounds", []):
                      filename = item.get("md5ext")
                      if not filename:
                          continue

                      if filename not in names:
                          raise RuntimeError(
                              "Missing sprite asset in archive: " + filename
                          )

                      destination = asset_dir / Path(filename).name
                      destination.write_bytes(archive.read(filename))
                      asset_files[filename] = destination

          # --------------------------------------------------
          # 2. Replace the default Scratch Cat project data.
          # --------------------------------------------------

          default_dir = root / "src/lib/default-project"
          original_data = default_dir / "project-data.js"
          backup_data = default_dir / "base-project-data.js"

          if not original_data.exists():
              raise RuntimeError("Scratch default project-data.js was not found.")

          if not backup_data.exists():
              original_data.rename(backup_data)

          sprite_json = json.dumps(sprite, ensure_ascii=False)

          replacement = f"""
          import baseProjectData from './base-project-data';

          const customSprite = {sprite_json};

          const projectData = translator => {{
              const data = baseProjectData(translator);
              data.targets = data.targets.filter(target => target.isStage);
              data.targets.push(customSprite);
              return data;
          }};

          export default projectData;
          """

          original_data.write_text(replacement, encoding="utf-8")

          # --------------------------------------------------
          # 3. Add the sprite's image and sound assets.
          # --------------------------------------------------

          index_file = default_dir / "index.js"
          index_text = index_file.read_text(encoding="utf-8")

          if "const defaultProject = translator =>" not in index_text:
              raise RuntimeError(
                  "Unexpected Scratch default-project index.js structure."
              )

          imports = []
          entries = []
          asset_number = 0

          for filename, path in asset_files.items():
              item = next(
                  item
                  for item in sprite.get("costumes", []) + sprite.get("sounds", [])
                  if item.get("md5ext") == filename
              )

              data_format = item.get("dataFormat", "").lower()
              variable = f"customAsset{asset_number}"
              relative_path = "./custom-sprite/" + path.name

              if data_format == "svg":
                  imports.append(
                      f"import {variable} from '!raw-loader!{relative_path}?';"
                  )
                  asset_data = f"encoder.encode({variable})"
                  asset_type = "ImageVector"
                  output_format = "SVG"

              else:
                  imports.append(
                      f"import {variable} from '!arraybuffer-loader!{relative_path}?';"
                  )
                  asset_data = f"new Uint8Array({variable})"

                  if data_format == "wav":
                      asset_type = "Sound"
                      output_format = "WAV"
                  else:
                      asset_type = "ImageBitmap"
                      output_format = data_format.upper()

              asset_id = item.get("assetId")
              if not asset_id:
                  raise RuntimeError(
                      "An asset in Sprite1.sprite3 has no assetId."
                  )

              entries.append(
                  "{ id: " + json.dumps(asset_id) +
                  ", assetType: " + json.dumps(asset_type) +
                  ", dataFormat: " + json.dumps(output_format) +
                  ", data: " + asset_data + " }"
              )

              asset_number += 1

          import_marker = "const defaultProject = translator =>"
          index_text = index_text.replace(
              import_marker,
              "\n".join(imports) + "\n\n" + import_marker,
              1
          )

          end = index_text.rfind("];")
          if end == -1:
              raise RuntimeError(
                  "Could not locate the end of the default project asset array."
              )

          if entries:
              index_text = (
                  index_text[:end].rstrip()
                  + ",\n"
                  + ",\n".join(entries)
                  + "\n"
                  + index_text[end:]
              )

          index_file.write_text(index_text, encoding="utf-8")

          # --------------------------------------------------
          # 4. Remove Share and See Project Page controls.
          # --------------------------------------------------

          menu_file = root / "src/components/menu-bar/menu-bar.jsx"
          menu = menu_file.read_text(encoding="utf-8")

          share_start = menu.find(
              '<div\n                        className={classNames(styles.menuBarItem)}>\n'
              '                        {this.props.canShare ? ('
          )

          if share_start == -1:
              raise RuntimeError(
                  "Could not find the Share button section in menu-bar.jsx."
              )

          share_end = menu.find("</div>", share_start)
          if share_end == -1:
              raise RuntimeError("Could not find the end of the Share section.")

          share_end += len("</div>")

          menu = (
              menu[:share_start]
              + '<div className={classNames(styles.menuBarItem)}>'
                '{this.props.canRemix ? remixButton : []}</div>'
              + menu[share_end:]
          )

          community_start = menu.find(
              '<div className={classNames(styles.menuBarItem, styles.communityButtonWrapper)}>'
          )

          if community_start == -1:
              raise RuntimeError(
                  "Could not find the See Project Page section."
              )

          community_end = menu.find("</div>", community_start)
          if community_end == -1:
              raise RuntimeError(
                  "Could not find the end of the community button section."
              )

          community_end += len("</div>")
          menu = menu[:community_start] + menu[community_end:]

          menu = menu.replace(
              "import ShareButton from './share-button.jsx';",
              ""
          )

          menu_file.write_text(menu, encoding="utf-8")

          # --------------------------------------------------
          # 5. Hide the account/user controls and Backpack.
          # --------------------------------------------------

          gui_file = root / "src/components/gui/gui.jsx"
          gui = gui_file.read_text(encoding="utf-8")

          gui = gui.replace(
              "{backpackVisible ? (",
              "{false && backpackVisible ? ("
          )

          gui_file.write_text(gui, encoding="utf-8")

          # --------------------------------------------------
          # 6. Apply a blue top bar.
          # --------------------------------------------------

          css_file = root / "src/components/menu-bar/menu-bar.css"

          blue_css = """
          /* Custom blue top bar */
          .menu-bar {
              background-color: #1677d2 !important;
          }

          .menu-bar-item.active,
          .menu-bar-item.hoverable:hover {
              background-color: #105da8 !important;
          }

          .account-info-group > :not(:first-child) {
              display: none !important;
          }
          """

          with css_file.open("a", encoding="utf-8") as file:
              file.write("\n" + blue_css + "\n")

          print("Scratch customizations completed successfully.")
          print("Default sprite:", sprite.get("name", "Custom Sprite"))
          print("Custom assets:", len(asset_files))
          PY

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p site/editor
          cp index.html site/index.html
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll
          touch site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
