name: Build and Deploy Scratch Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html || { echo "index.html is missing"; exit 1; }
          test -f Sprite1.sprite3 || { echo "Sprite1.sprite3 is missing from the repository root"; exit 1; }

      - name: Checkout matching Scratch GUI source
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: dae2a97a5bb0cd8a7513fafd60f9e7488f2a89a4
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install Scratch dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Apply KryptoLite customizations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          import shutil
          
          ROOT = Path('scratch-gui-src')
          DEFAULT = ROOT / 'src/lib/default-project'
          
          # 1) Use the supplied Scratch sprite export as the default sprite.
          with zipfile.ZipFile('Sprite1.sprite3') as archive:
              names = archive.namelist()
              if 'sprite.json' not in names:
                  raise RuntimeError('Sprite1.sprite3 must contain sprite.json')
              sprite = json.loads(archive.read('sprite.json'))
              if sprite.get('isStage'):
                  raise RuntimeError('Sprite1.sprite3 contains a Stage, not a sprite')
              items = sprite.get('costumes', []) + sprite.get('sounds', [])
              asset_dir = DEFAULT / 'custom-sprite'
              if asset_dir.exists():
                  shutil.rmtree(asset_dir)
              asset_dir.mkdir(parents=True)
              for item in items:
                  filename = item.get('md5ext')
                  if not filename or filename not in names:
                      raise RuntimeError(f'Missing sprite asset: {filename}')
                  (asset_dir / Path(filename).name).write_bytes(archive.read(filename))
          
          (DEFAULT / 'custom-sprite-data.js').write_text(
              'export default ' + json.dumps(sprite, ensure_ascii=False) + ';\n', encoding='utf-8'
          )
          
          # Keep Scratch's stage and replace its starter cat with Sprite1.
          data_file = DEFAULT / 'project-data.js'
          data = data_file.read_text(encoding='utf-8')
          if "import customSprite from './custom-sprite-data';" not in data:
              data = "import customSprite from './custom-sprite-data';\n" + data
          if 'const project = ({' not in data:
              if 'return ({' not in data:
                  raise RuntimeError('Unexpected project-data.js: default project object not found')
              data = data.replace('return ({', 'const project = ({', 1)
              tail = '    });\n};'
              if tail not in data:
                  raise RuntimeError('Unexpected project-data.js: end of project object not found')
              data = data.replace(tail,
                  '    });\n'
                  '    project.targets = project.targets.filter(target => target.isStage);\n'
                  '    project.targets.push(customSprite);\n'
                  '    return project;\n};', 1)
          data_file.write_text(data, encoding='utf-8')
          
          # Register each exported costume and sound in the default project asset list.
          index_file = DEFAULT / 'index.js'
          index = index_file.read_text(encoding='utf-8')
          imports, entries = [], []
          for number, item in enumerate(items):
              fmt = item.get('dataFormat', '').lower()
              asset_id = item.get('assetId')
              filename = Path(item['md5ext']).name
              if not asset_id:
                  raise RuntimeError('A sprite asset has no assetId')
              var = f'customAsset{number}'
              rel = './custom-sprite/' + filename
              if fmt == 'svg':
                  imports.append(f"import {var} from '!raw-loader!{rel}?';")
                  asset_type, expression, out_format = 'ImageVector', f'encoder.encode({var})', 'SVG'
              elif fmt == 'wav':
                  imports.append(f"import {var} from '!arraybuffer-loader!{rel}?';")
                  asset_type, expression, out_format = 'Sound', f'new Uint8Array({var})', 'WAV'
              else:
                  raise RuntimeError(f'Unsupported sprite asset format: {fmt}')
              entries.append(
                  '{ id: ' + json.dumps(asset_id) +
                  ', assetType: ' + json.dumps(asset_type) +
                  ', dataFormat: ' + json.dumps(out_format) +
                  ', data: ' + expression + ' }'
              )
          marker = 'const defaultProject = translator =>'
          if marker not in index:
              raise RuntimeError('Unexpected default-project index.js')
          index = index.replace(marker, '\n'.join(imports) + '\n\n' + marker, 1)
          end = index.rfind('];')
          if end < 0:
              raise RuntimeError('Could not locate end of default asset list in index.js')
          index = index[:end].rstrip() + ',\n' + ',\n'.join(entries) + '\n' + index[end:]
          index_file.write_text(index, encoding='utf-8')
          
          # 2) Register the custom extension directly with the page's VM.
          # This avoids the worker sandbox, which cannot access window.alert or the GUI.
          gui_file = ROOT / 'src/containers/gui.jsx'
          gui = gui_file.read_text(encoding='utf-8')
          anchor = '        setProjectIdMetadata(this.props.projectId);'
          if 'KryptoLite internal extension registration' not in gui:
              if anchor not in gui:
                  raise RuntimeError('Could not locate GUI initialization point')
              gui = gui.replace(anchor, anchor + r'''
                  // KryptoLite internal extension registration
                  try {
                      const manager = this.props.vm.extensionManager;
                      if (!manager.isExtensionLoaded('kryptoLite')) {
                          class KryptoLiteBlocks {
                              constructor(runtime) {
                                  this.runtime = runtime;
                                  this.alertUses = 0;
                                  this.runtime.on('PROJECT_LOADED', () => { this.alertUses = 0; });
                              }
                              getInfo() {
                                  return {
                                      id: 'kryptoLite',
                                      name: 'Zany Blocks',
                                      color1: '#8B0000',
                                      color2: '#650000',
                                      color3: '#420000',
                                      blocks: [
                                          {opcode: 'alertMessage', blockType: 'command', text: 'alert [MESSAGE]',
                                              arguments: {MESSAGE: {type: 'string', defaultValue: 'Hello!'}}},
                                          {opcode: 'endlessSuffering', blockType: 'command',
                                              text: 'block of endless suffering and despair'},
                                          {opcode: 'revertAll', blockType: 'command', text: 'Revert All'}
                                      ]
                                  };
                              }
                              alertMessage(args) {
                                  if (this.alertUses >= 3) {
                                      window.alert('This project has reached its limit of 3 alerts.');
                                      return;
                                  }
                                  this.alertUses += 1;
                                  window.alert(String(args.MESSAGE || ''));
                              }
                              endlessSuffering() {
                                  window.dispatchEvent(new Event('scratch-chaos'));
                              }
                              revertAll() {
                                  window.dispatchEvent(new Event('krypto-revert-all'));
                              }
                          }
                          const serviceName = manager._registerInternalExtension(new KryptoLiteBlocks(this.props.vm.runtime));
                          manager._loadedExtensions.set('kryptoLite', serviceName);
                          manager.refreshBlocks().catch(error => console.error('Could not refresh Zany Blocks:', error));
                      }
                  } catch (error) {
                      console.error('Could not register Zany Blocks:', error);
                  }
              ''', 1)
          gui_file.write_text(gui, encoding='utf-8')

          # Expose the workspace and the exact Blockly implementation for recovery.
          blocks_file = ROOT / 'src/containers/blocks.jsx'
          blocks = blocks_file.read_text(encoding='utf-8')
          anchor = '        this.workspace = this.ScratchBlocks.inject(this.blocks, workspaceConfig);'
          if 'window.__scratchWorkspace = this.workspace' not in blocks:
              if anchor not in blocks:
                  raise RuntimeError('Could not locate Blockly workspace initialization')
              blocks = blocks.replace(anchor, anchor + '''
                  window.__scratchWorkspace = this.workspace;
                  window.__scratchBlockly = this.ScratchBlocks;
                  window.dispatchEvent(new Event('scratch-workspace-ready'));''', 1)
          blocks_file.write_text(blocks, encoding='utf-8')

          # The Modes dropdown is added directly to the editor top bar by custom-modes.js.

          # Blue top bar and hide requested controls.
          css_file = ROOT / 'src/components/menu-bar/menu-bar.css'
          css_file.write_text(css_file.read_text(encoding='utf-8') + '''

          /* KryptoLite blue editor theme */
          [class*="menu-bar_menu-bar"] { background: #1677d2 !important; }
          [class*="menu-bar_menu-bar"] [class*="menu-bar-item"]:hover { background: #105da8 !important; }
          [class*="menu-bar_menu-bar"] [class*="share-button"],
          [class*="menu-bar_menu-bar"] [class*="community-button"],
          [class*="menu-bar_menu-bar"] [class*="account-nav"],
          [class*="menu-bar_menu-bar"] [class*="login-dropdown"],
          [class*="menu-bar_menu-bar"] [class*="user-avatar"] { display: none !important; }
          ''', encoding='utf-8')

          gui_component = ROOT / 'src/components/gui/gui.jsx'
          g = gui_component.read_text(encoding='utf-8')
          if '{false && backpackVisible ? (' not in g:
              g = g.replace('{backpackVisible ? (', '{false && backpackVisible ? (', 1)
          gui_component.write_text(g, encoding='utf-8')

          # 3) Custom extension source is retained as documentation/fallback;
          # actual registration is performed in gui.jsx with the live VM runtime.
          (ROOT / 'custom-extension.js').write_text(r'''(function () {
              'use strict';
              // Registered internally by the GUI so it can safely access the page.
          })();
          ''', encoding='utf-8')

          # 4) Modes panel, RNG unlocking, reversible Progress Detected, and chaos reset.
          (ROOT / 'custom-modes.js').write_text(r'''(function () {
              'use strict';
              const KEY = 'kryptolite-scratch-modes-v2';
              const state = {rng: false, progress: false, unlocked: []};
              try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
              const save = () => localStorage.setItem(KEY, JSON.stringify(state));
              const types = ['kryptoLite_alertMessage', 'kryptoLite_endlessSuffering', 'kryptoLite_revertAll'];
              const deleted = [];
              let deleting = false;
              const getWorkspace = () => window.__scratchWorkspace || null;
              const getBlockly = () => window.__scratchBlockly || null;

              function toast(message) {
                  const el = document.createElement('div');
                  el.textContent = message;
                  Object.assign(el.style, {position:'fixed',bottom:'18px',left:'50%',transform:'translateX(-50%)',zIndex:999999,
                      background:'#202b3a',color:'#fff',padding:'10px 16px',borderRadius:'8px',font:'14px Arial',boxShadow:'0 4px 18px #0005'});
                  document.body.appendChild(el);
                  setTimeout(() => el.remove(), 3200);
              }
              function refreshLocks() {
                  const ws = getWorkspace();
                  if (!ws || !ws.getFlyout || !ws.getFlyout()) return;
                  const flyout = ws.getFlyout().getWorkspace();
                  if (!flyout) return;
                  flyout.getAllBlocks(false).forEach(block => {
                      if (types.includes(block.type) && block.setDisabled) {
                          block.setDisabled(state.rng && !state.unlocked.includes(block.type));
                      }
                  });
              }
              function attachWorkspace() {
                  const ws = getWorkspace();
                  if (!ws || ws.__kryptoModesAttached) return;
                  ws.__kryptoModesAttached = true;
                  ws.addChangeListener(event => {
                      if (!state.progress || deleting || !event || event.isUiEvent) return;
                      if (!['move', 'change', 'create'].includes(event.type) || Math.random() > 0.012) return;
                      const blocks = ws.getTopBlocks(false).filter(block => !block.isShadow && !block.isInFlyout);
                      if (!blocks.length) return;
                      const Blockly = getBlockly();
                      if (!Blockly || !Blockly.Xml) return;
                      const block = blocks[Math.floor(Math.random() * blocks.length)];
                      try {
                          const dom = Blockly.Xml.blockToDom(block);
                          const xy = block.getRelativeToSurfaceXY();
                          dom.setAttribute('x', xy.x);
                          dom.setAttribute('y', xy.y);
                          deleted.push(Blockly.Xml.domToText(dom));
                          deleting = true;
                          block.dispose(true);
                          toast('Progress detected: a block vanished. Use Revert All to restore deleted blocks.');
                      } catch (error) {
                          console.error('Could not preserve deleted block:', error);
                      } finally { setTimeout(() => { deleting = false; }, 0); }
                  });
                  refreshLocks();
              }
              function revertAll() {
                  const ws = getWorkspace();
                  const Blockly = getBlockly();
                  if (!ws || !Blockly || !Blockly.Xml) return toast('Workspace is not ready yet.');
                  let restored = 0;
                  deleting = true;
                  try {
                      while (deleted.length) {
                          const saved = deleted.pop();
                          const dom = Blockly.Xml.textToDom(saved);
                          Blockly.Xml.domToBlock(dom, ws);
                          restored++;
                      }
                  } catch (error) {
                      console.error('Revert All could not restore a block:', error);
                      toast('Some blocks could not be restored. Check the browser console.');
                  } finally {
                      setTimeout(() => { deleting = false; }, 0);
                  }
                  toast(restored ? 'Reverted ' + restored + ' deleted block(s).' : 'There are no deleted blocks to restore.');
              }
              function addModesButton() {
                  const bar = document.querySelector('[class*="menu-bar_menu-bar"]') || document.querySelector('[class*="menu-bar"]');
                  if (!bar || document.getElementById('krypto-modes-button')) return;
                  const button = document.createElement('button');
                  button.id = 'krypto-modes-button';
                  button.type = 'button';
                  button.textContent = 'Modes ▾';
                  Object.assign(button.style, {alignSelf:'stretch',border:0,background:'transparent',color:'#fff',
                      padding:'0 13px',font:'bold 13px Arial',cursor:'pointer'});
                  button.addEventListener('mouseenter', () => { button.style.background = '#105da8'; });
                  button.addEventListener('mouseleave', () => { button.style.background = 'transparent'; });
                  button.addEventListener('click', openPanel);
                  bar.appendChild(button);
              }
              function resetChaos() { document.body.classList.remove('krypto-chaos'); }
              function openPanel() {
                  const old = document.getElementById('krypto-modes-panel');
                  if (old) { old.remove(); return; }
                  const panel = document.createElement('section');
                  panel.id = 'krypto-modes-panel';
                  Object.assign(panel.style, {position:'fixed',top:'54px',right:'12px',width:'300px',zIndex:999998,
                      background:'#fff',color:'#222',padding:'16px',borderRadius:'12px',boxShadow:'0 8px 32px #0005',font:'14px Arial'});
                  panel.innerHTML = '<h3 style="margin:0 0 12px">Experimental Modes</h3>' +
                      '<label style="display:flex;gap:8px;margin:12px 0"><input id="krng" type="checkbox"> RNG Mode</label>' +
                      '<p style="color:#555">Roll to unlock the three Zany Blocks. Each roll unlocks one random block.</p>' +
                      '<button id="kroll" style="padding:8px 12px">Roll to unlock</button><hr style="margin:14px 0">' +
                      '<label style="display:flex;gap:8px;margin:12px 0"><input id="kprogress" type="checkbox"> Progress Detected</label>' +
                      '<p style="color:#555">Randomly removes a top-level block. Revert All restores blocks removed by this mode.</p><hr style="margin:14px 0">' +
                      '<button id="kreset" style="padding:8px 12px">Reset Chaos</button> ' +
                      '<button id="krevert" style="padding:8px 12px">Revert All</button> ' +
                      '<button id="kclose" style="padding:8px 12px">Close</button>';
                  document.body.appendChild(panel);
                  panel.querySelector('#krng').checked = state.rng;
                  panel.querySelector('#kprogress').checked = state.progress;
                  panel.querySelector('#krng').addEventListener('change', e => {
                      state.rng = e.target.checked;
                      state.unlocked = state.rng ? [] : types.slice();
                      save(); refreshLocks();
                  });
                  panel.querySelector('#kprogress').addEventListener('change', e => { state.progress = e.target.checked; save(); });
                  panel.querySelector('#kroll').addEventListener('click', () => {
                      const locked = types.filter(type => !state.unlocked.includes(type));
                      if (!locked.length) return toast('All Zany Blocks are unlocked.');
                      const chosen = locked[Math.floor(Math.random() * locked.length)];
                      state.unlocked.push(chosen); save(); refreshLocks();
                      toast('Unlocked: ' + chosen.replace('kryptoLite_', ''));
                  });
                  panel.querySelector('#kreset').addEventListener('click', resetChaos);
                  panel.querySelector('#krevert').addEventListener('click', revertAll);
                  panel.querySelector('#kclose').addEventListener('click', () => panel.remove());
              }
              window.addEventListener('scratch-open-modes', openPanel);
              window.addEventListener('scratch-chaos', () => {
                  document.body.classList.add('krypto-chaos');
                  toast('ENDLESS SUFFERING AND DESPAIR — Reset Chaos or press Escape to restore the interface.');
              });
              window.addEventListener('krypto-revert-all', revertAll);
              window.addEventListener('scratch-workspace-ready', () => { attachWorkspace(); refreshLocks(); });
              document.addEventListener('keydown', event => { if (event.key === 'Escape') resetChaos(); });
              const observer = new MutationObserver(() => { attachWorkspace(); refreshLocks(); addModesButton(); });
              observer.observe(document.documentElement, {childList:true, subtree:true});
              addModesButton();
              const style = document.createElement('style');
              style.textContent = `
                body.krypto-chaos .menu-bar { animation:krypto-wobble .22s infinite alternate !important; filter:hue-rotate(145deg) contrast(1.7) !important; }
                body.krypto-chaos .blocklyWorkspace { animation:krypto-wobble .17s infinite alternate !important; filter:hue-rotate(220deg) saturate(3) !important; }
                body.krypto-chaos .stage-wrapper { transform:rotate(1.5deg) scale(.97); filter:invert(.12) hue-rotate(80deg); }
                @keyframes krypto-wobble { from { transform:translate(0,0) rotate(-.4deg); } to { transform:translate(3px,-2px) rotate(.5deg); } }
              `;
              document.head.appendChild(style);
              window.addEventListener('load', () => { attachWorkspace(); refreshLocks(); addModesButton(); });
          })();
          ''', encoding='utf-8')

          print('KryptoLite customizations installed.')
          print('Default sprite:', sprite.get('name', 'Sprite1'))
          print('Sprite assets:', len(items))
          PY

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          cp scratch-gui-src/custom-extension.js scratch-gui-src/build/custom-extension.js
          cp scratch-gui-src/custom-modes.js scratch-gui-src/build/custom-modes.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scratch-gui-src/build/index.html')
          html = p.read_text(encoding='utf-8')
          import re
          html = re.sub(r'<title>.*?</title>', '<title>blfroseozm: client</title>', html, count=1, flags=re.IGNORECASE | re.DOTALL)
          if 'custom-modes.js' not in html:
              html = html.replace('</body>', '<script src="./custom-modes.js"></script>\n</body>')
          p.write_text(html, encoding='utf-8')
          PY
          mkdir -p site/editor
          cp index.html site/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path('site/index.html')
          html = page.read_text(encoding='utf-8')
          slogan = 'Imagine, Create, wait whats that'
          if slogan not in html:
              html = html.replace('</body>', '<p class=\"mod-slogan\">' + slogan + '</p>\n</body>')
          page.write_text(html, encoding='utf-8')
          PY
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
