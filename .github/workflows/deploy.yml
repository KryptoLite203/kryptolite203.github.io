name: Build and Deploy Scratch Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html || { echo "index.html is missing"; exit 1; }
          test -f Sprite1.sprite3 || { echo "Sprite1.sprite3 is missing from the repository root"; exit 1; }

      - name: Checkout matching Scratch GUI source
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-gui
          ref: dae2a97a5bb0cd8a7513fafd60f9e7488f2a89a4
          path: scratch-gui-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui-src/package-lock.json

      - name: Install Scratch dependencies
        working-directory: scratch-gui-src
        run: npm ci

      - name: Apply KryptoLite customizations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          import shutil
          
          ROOT = Path('scratch-gui-src')
          DEFAULT = ROOT / 'src/lib/default-project'
          
          # 1) Use the supplied Scratch sprite export as the default sprite.
          with zipfile.ZipFile('Sprite1.sprite3') as archive:
              names = archive.namelist()
              if 'sprite.json' not in names:
                  raise RuntimeError('Sprite1.sprite3 must contain sprite.json')
              sprite = json.loads(archive.read('sprite.json'))
              if sprite.get('isStage'):
                  raise RuntimeError('Sprite1.sprite3 contains a Stage, not a sprite')
              items = sprite.get('costumes', []) + sprite.get('sounds', [])
              asset_dir = DEFAULT / 'custom-sprite'
              if asset_dir.exists():
                  shutil.rmtree(asset_dir)
              asset_dir.mkdir(parents=True)
              for item in items:
                  filename = item.get('md5ext')
                  if not filename or filename not in names:
                      raise RuntimeError(f'Missing sprite asset: {filename}')
                  (asset_dir / Path(filename).name).write_bytes(archive.read(filename))
          
          (DEFAULT / 'custom-sprite-data.js').write_text(
              'export default ' + json.dumps(sprite, ensure_ascii=False) + ';\n', encoding='utf-8'
          )
          
          # Keep Scratch's stage and replace its starter cat with Sprite1.
          data_file = DEFAULT / 'project-data.js'
          data = data_file.read_text(encoding='utf-8')
          if "import customSprite from './custom-sprite-data';" not in data:
              data = "import customSprite from './custom-sprite-data';\n" + data
          if 'const project = ({' not in data:
              if 'return ({' not in data:
                  raise RuntimeError('Unexpected project-data.js: default project object not found')
              data = data.replace('return ({', 'const project = ({', 1)
              tail = '    });\n};'
              if tail not in data:
                  raise RuntimeError('Unexpected project-data.js: end of project object not found')
              data = data.replace(tail,
                  '    });\n'
                  '    project.targets = project.targets.filter(target => target.isStage);\n'
                  '    project.targets.push(customSprite);\n'
                  '    return project;\n};', 1)
          data_file.write_text(data, encoding='utf-8')
          
          # Register each exported costume and sound in the default project asset list.
          index_file = DEFAULT / 'index.js'
          index = index_file.read_text(encoding='utf-8')
          imports, entries = [], []
          for number, item in enumerate(items):
              fmt = item.get('dataFormat', '').lower()
              asset_id = item.get('assetId')
              filename = Path(item['md5ext']).name
              if not asset_id:
                  raise RuntimeError('A sprite asset has no assetId')
              var = f'customAsset{number}'
              rel = './custom-sprite/' + filename
              if fmt == 'svg':
                  imports.append(f"import {var} from '!raw-loader!{rel}?';")
                  asset_type, expression, out_format = 'ImageVector', f'encoder.encode({var})', 'SVG'
              elif fmt == 'wav':
                  imports.append(f"import {var} from '!arraybuffer-loader!{rel}?';")
                  asset_type, expression, out_format = 'Sound', f'new Uint8Array({var})', 'WAV'
              else:
                  raise RuntimeError(f'Unsupported sprite asset format: {fmt}')
              entries.append(
                  '{ id: ' + json.dumps(asset_id) +
                  ', assetType: ' + json.dumps(asset_type) +
                  ', dataFormat: ' + json.dumps(out_format) +
                  ', data: ' + expression + ' }'
              )
          marker = 'const defaultProject = translator =>'
          if marker not in index:
              raise RuntimeError('Unexpected default-project index.js')
          index = index.replace(marker, '\n'.join(imports) + '\n\n' + marker, 1)
          end = index.rfind('];')
          if end < 0:
              raise RuntimeError('Could not locate end of default asset list in index.js')
          index = index[:end].rstrip() + ',\n' + ',\n'.join(entries) + '\n' + index[end:]
          index_file.write_text(index, encoding='utf-8')
          
          # 2) Load custom blocks and bridge extension events into the browser UI.
          gui_file = ROOT / 'src/containers/gui.jsx'
          gui = gui_file.read_text(encoding='utf-8')
          anchor = '        setProjectIdMetadata(this.props.projectId);'
          if 'custom-extension.js' not in gui:
              if anchor not in gui:
                  raise RuntimeError('Could not locate GUI initialization point')
              gui = gui.replace(anchor, anchor + '''
                  const vm = this.props.vm;
                  if (vm && !window.__zanyBlocksLoadStarted) {
                      window.__zanyBlocksLoadStarted = true;
                      vm.runtime.on('CUSTOM_ALERT', message => window.alert(String(message)));
                      vm.runtime.on('CUSTOM_CHAOS', () => window.dispatchEvent(new Event('scratch-chaos')));
                      const loadZanyBlocks = () => {
                          const manager = vm.extensionManager;
                          if (!manager || typeof manager.loadExtensionURL !== 'function') {
                              window.setTimeout(loadZanyBlocks, 250);
                              return;
                          }
                          const extensionUrl = new URL('custom-extension.js', document.baseURI).href;
                          manager.loadExtensionURL(extensionUrl, {type: 'unsandboxed'}).catch(error => {
                              console.error('Could not load Zany Blocks / Hidden Blocks:', error);
                              window.__zanyBlocksLoadStarted = false;
                          });
                      };
                      window.setTimeout(loadZanyBlocks, 0);
                  }''', 1)
          gui_file.write_text(gui, encoding='utf-8')
          
          # Expose the live Blockly workspace to the modes controller.
          blocks_file = ROOT / 'src/containers/blocks.jsx'
          blocks = blocks_file.read_text(encoding='utf-8')
          anchor = '        this.workspace = this.ScratchBlocks.inject(this.blocks, workspaceConfig);'
          if 'window.__scratchWorkspace = this.workspace' not in blocks:
              if anchor not in blocks:
                  raise RuntimeError('Could not locate Blockly workspace initialization')
              blocks = blocks.replace(anchor, anchor + '''
                  window.__scratchWorkspace = this.workspace;
                  window.dispatchEvent(new Event('scratch-workspace-ready'));''', 1)
          blocks_file.write_text(blocks, encoding='utf-8')
          
          # Modes is inserted beside the Language control by custom-modes.js.
          # Do not add it to Settings.
          # Blue top bar and hide the requested controls.
          css_file = ROOT / 'src/components/menu-bar/menu-bar.css'
          css_file.write_text(css_file.read_text(encoding='utf-8') + '''
          
          /* KryptoLite blue editor theme */
          .menu-bar { background: #1677d2 !important; }
          .menu-bar .menu-bar-item.active,
          .menu-bar .menu-bar-item.hoverable:hover { background: #105da8 !important; }
          .menu-bar [class*="share-button"],
          .menu-bar [class*="community-button"],
          .menu-bar [class*="account-nav"],
          .menu-bar [class*="login-dropdown"],
          .menu-bar [class*="user-avatar"] { display: none !important; }
          ''', encoding='utf-8')
          
          gui_component = ROOT / 'src/components/gui/gui.jsx'
          g = gui_component.read_text(encoding='utf-8')
          if '{false && backpackVisible ? (' not in g:
              g = g.replace('{backpackVisible ? (', '{false && backpackVisible ? (', 1)
          gui_component.write_text(g, encoding='utf-8')
          
          # 3) Custom Scratch extension. Three alerts per loaded project.
          (ROOT / 'custom-extension.js').write_text(r'''(function () {
              'use strict';
              class KryptoLiteBlocks {
                  constructor () { this.alertUses = 0; this.runtime = Scratch.vm.runtime; this.runtime.on('PROJECT_LOADED', () => { this.alertUses = 0; }); }
                  getInfo () {
                      return {
                          id: 'zanyBlocks', name: 'Zany Blocks', color1: '#8b1e1e', color2: '#6d1515', color3: '#4a0d0d',
                          blocks: [
                              {opcode: 'alertMessage', blockType: Scratch.BlockType.COMMAND, text: 'alert [MESSAGE]',
                                  arguments: {MESSAGE: {type: Scratch.ArgumentType.STRING, defaultValue: 'Hello!'}}},
                              {opcode: 'endlessSuffering', blockType: Scratch.BlockType.COMMAND,
                                  text: 'block of endless suffering and despair'},
                              {opcode: 'fleshBlock', blockType: Scratch.BlockType.COMMAND,
                                  text: '2x2 Pulsating Block Of Flesh'}
                          ]
                      };
                  }
                  alertMessage (args, util) {
                      const runtime = this.runtime;
                      if (this.alertUses >= 3) {
                          runtime.emit('CUSTOM_ALERT', 'This project has reached its limit of 3 alerts.');
                          return;
                      }
                      this.alertUses += 1;
                      runtime.emit('CUSTOM_ALERT', args.MESSAGE);
                  }
                  endlessSuffering () { this.runtime.emit('CUSTOM_CHAOS'); }
                  fleshBlock () {
                      const stage = document.querySelector('.stage-wrapper') || document.querySelector('.stage');
                      if (!stage) return;
                      let layer = stage.querySelector('.krypto-flesh-layer');
                      if (!layer) {
                          layer = document.createElement('div');
                          layer.className = 'krypto-flesh-layer';
                          Object.assign(layer.style, {position:'absolute',inset:'0',overflow:'hidden',pointerEvents:'none',zIndex:'30'});
                          if (getComputedStyle(stage).position === 'static') stage.style.position = 'relative';
                          stage.appendChild(layer);
                      }
                      const makeCell = (x, y) => {
                          const cell = document.createElement('div');
                          cell.className = 'krypto-flesh-cell';
                          Object.assign(cell.style, {position:'absolute',width:'18px',height:'18px',left:x+'px',top:y+'px',
                              background:'radial-gradient(circle at 35% 30%,#f59ab0,#8b173e 65%,#3c071d)',
                              border:'1px solid #4d0924',borderRadius:'35% 55% 42% 60%',
                              boxShadow:'0 0 7px #c52c62',animation:'krypto-flesh-pulse .65s ease-in-out infinite alternate'});
                          layer.appendChild(cell);
                          return cell;
                      };
                      const rect = stage.getBoundingClientRect();
                      const x = Math.max(0, Math.random() * Math.max(1, rect.width - 40));
                      const y = Math.max(0, Math.random() * Math.max(1, rect.height - 40));
                      makeCell(x,y); makeCell(x+18,y); makeCell(x,y+18); makeCell(x+18,y+18);
                      if (!layer.dataset.running) {
                          layer.dataset.running = '1';
                          layer._timer = setInterval(() => {
                              const cells = [...layer.children];
                              if (!cells.length) { clearInterval(layer._timer); layer.dataset.running=''; return; }
                              cells.forEach(cell => {
                                  const left = parseFloat(cell.style.left)||0, top = parseFloat(cell.style.top)||0;
                                  cell.style.left = Math.max(0,Math.min(layer.clientWidth-18,left+(Math.random()*34-17)))+'px';
                                  cell.style.top = Math.max(0,Math.min(layer.clientHeight-18,top+(Math.random()*34-17)))+'px';
                              });
                              if (cells.length < 90 && Math.random() < .72) {
                                  const parent = cells[Math.floor(Math.random()*cells.length)];
                                  makeCell(Math.max(0,Math.min(layer.clientWidth-18,(parseFloat(parent.style.left)||0)+(Math.random()*42-21))),
                                      Math.max(0,Math.min(layer.clientHeight-18,(parseFloat(parent.style.top)||0)+(Math.random()*42-21))));
                              }
                          }, 650);
                      }
                  }
              }
              Scratch.extensions.register(new KryptoLiteBlocks());

              class HiddenBlocks {
                  constructor () { this.counter = 0; this.runtime = Scratch.vm.runtime; }
                  getInfo () {
                      return {id:'kryptoHidden',name:'Hidden Blocks',color1:'#8b35c9',color2:'#7026a8',color3:'#551b82',
                          blocks:[
                              {opcode:'scrollRight',blockType:Scratch.BlockType.COMMAND,text:'scroll right [AMOUNT]',arguments:{AMOUNT:{type:Scratch.ArgumentType.NUMBER,defaultValue:10}}},
                              {opcode:'scrollUp',blockType:Scratch.BlockType.COMMAND,text:'scroll up [AMOUNT]',arguments:{AMOUNT:{type:Scratch.ArgumentType.NUMBER,defaultValue:10}}},
                              {opcode:'alignScene',blockType:Scratch.BlockType.COMMAND,text:'align scene'},
                              {opcode:'xScroll',blockType:Scratch.BlockType.REPORTER,text:'x scroll'},
                              {opcode:'yScroll',blockType:Scratch.BlockType.REPORTER,text:'y scroll'},
                              {opcode:'hideAllSprites',blockType:Scratch.BlockType.COMMAND,text:'hide all sprites'},
                              {opcode:'whenSpriteTouches',blockType:Scratch.BlockType.HAT,text:'when this sprite touches [TARGET]',arguments:{TARGET:{type:Scratch.ArgumentType.STRING,menu:'targets'}}},
                              {opcode:'forEach',blockType:Scratch.BlockType.LOOP,text:'for each [COUNT] times',arguments:{COUNT:{type:Scratch.ArgumentType.NUMBER,defaultValue:10}},branchCount:1},
                              {opcode:'whileLoop',blockType:Scratch.BlockType.LOOP,text:'while [CONDITION]',arguments:{CONDITION:{type:Scratch.ArgumentType.BOOLEAN}}},
                              {opcode:'counter',blockType:Scratch.BlockType.REPORTER,text:'counter'},
                              {opcode:'incrementCounter',blockType:Scratch.BlockType.COMMAND,text:'increment counter'},
                              {opcode:'clearCounter',blockType:Scratch.BlockType.COMMAND,text:'clear counter'},
                              {opcode:'userId',blockType:Scratch.BlockType.REPORTER,text:'user ID'}
                          ],menus:{targets:{acceptReporters:true,items:['edge','mouse-pointer']}}};
                  }
                  scrollRight(args) { const s=document.querySelector('.stage-wrapper'); if(s) s.scrollLeft += Number(args.AMOUNT)||0; }
                  scrollUp(args) { const s=document.querySelector('.stage-wrapper'); if(s) s.scrollTop -= Number(args.AMOUNT)||0; }
                  alignScene() { const s=document.querySelector('.stage-wrapper'); if(s){s.scrollLeft=0;s.scrollTop=0;} }
                  xScroll() { const s=document.querySelector('.stage-wrapper'); return s ? s.scrollLeft : 0; }
                  yScroll() { const s=document.querySelector('.stage-wrapper'); return s ? s.scrollTop : 0; }
                  hideAllSprites(args,util) { const targets=this.runtime ? this.runtime.targets : []; targets.filter(t=>!t.isStage).forEach(t=>{t.visible=false;}); }
                  whenSpriteTouches() { return false; }
                  forEach(args,util) { for(let i=0;i<Math.max(0,Math.min(1000,Number(args.COUNT)||0));i++) util.startBranch(1,true); }
                  whileLoop(args,util) { if(args.CONDITION) util.startBranch(1,true); }
                  counter() { return this.counter; }
                  incrementCounter() { this.counter++; }
                  clearCounter() { this.counter=0; }
                  userId() { return 'guest'; }
              }
              Scratch.extensions.register(new HiddenBlocks());
          })();
          ''', encoding='utf-8')
          
          # 4) Modes panel, RNG unlocking, reversible Progress Detected, and chaos reset.
          (ROOT / 'custom-modes.js').write_text(r'''(function () {
              'use strict';
              const KEY = 'kryptolite-scratch-modes-v1';
              const state = {rng: false, progress: false, unlocked: []};
              try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
              const save = () => localStorage.setItem(KEY, JSON.stringify(state));
              const types = ['zanyBlocks_alertMessage', 'zanyBlocks_endlessSuffering', 'zanyBlocks_fleshBlock', 'kryptoHidden_scrollRight', 'kryptoHidden_scrollUp', 'kryptoHidden_alignScene', 'kryptoHidden_xScroll', 'kryptoHidden_yScroll', 'kryptoHidden_hideAllSprites', 'kryptoHidden_whenSpriteTouches', 'kryptoHidden_forEach', 'kryptoHidden_whileLoop', 'kryptoHidden_counter', 'kryptoHidden_incrementCounter', 'kryptoHidden_clearCounter', 'kryptoHidden_userId'];
              let allBlockTypes = [];
              function collectTypes () { const ws=getWorkspace(); if(!ws || !ws.getFlyout || !ws.getFlyout()) return; const f=ws.getFlyout().getWorkspace(); if(!f) return; allBlockTypes=[...new Set(f.getAllBlocks(false).map(b=>b.type))]; }
              let deleting = false;
              const deletedBlocks = [];
              const getWorkspace = () => window.__scratchWorkspace || null;
          
              function toast (message) {
                  const el = document.createElement('div');
                  el.textContent = message;
                  Object.assign(el.style, {position:'fixed',bottom:'18px',left:'50%',transform:'translateX(-50%)',zIndex:999999,
                      background:'#202b3a',color:'#fff',padding:'10px 16px',borderRadius:'8px',font:'14px Arial',boxShadow:'0 4px 18px #0005'});
                  document.body.appendChild(el);
                  setTimeout(() => el.remove(), 3200);
              }
              function refreshLocks () {
                  const ws = getWorkspace();
                  if (!ws || !ws.getFlyout || !ws.getFlyout()) return;
                  const flyout = ws.getFlyout().getWorkspace();
                  if (!flyout) return;
                  collectTypes();
                  flyout.getAllBlocks(false).forEach(block => {
                      if (block.setDisabled) block.setDisabled(state.rng && !state.unlocked.includes(block.type));
                  });
              }
              function attachWorkspace () {
                  const ws = getWorkspace();
                  if (!ws || ws.__kryptoModesAttached) return;
                  ws.__kryptoModesAttached = true;
                  ws.addChangeListener(event => {
                      if (!state.progress || deleting || !event || event.isUiEvent) return;
                      if (!['move', 'change', 'create'].includes(event.type) || Math.random() > 0.012) return;
                      const blocks = ws.getTopBlocks(false).filter(block => !block.isShadow && !block.isInFlyout);
                      if (!blocks.length) return;
                      deleting = true;
                      try {
                          const victim = blocks[Math.floor(Math.random() * blocks.length)];
                          try { deletedBlocks.push(Blockly.Xml.domToText(Blockly.Xml.blockToDom(victim, true))); } catch (e) {}
                          victim.dispose(true);
                          toast('Progress detected: a block vanished. Use Revert All to restore deleted blocks.');
                      } finally { setTimeout(() => { deleting = false; }, 0); }
                  });
                  refreshLocks();
              }
              let chaosTimer = null;
              function resetChaos () {
                  document.body.classList.remove('krypto-chaos');
                  if (chaosTimer) clearInterval(chaosTimer);
                  chaosTimer = null;
                  document.querySelectorAll('[data-krypto-chaos]').forEach(el => {
                      el.style.transform = el.dataset.kryptoTransform || '';
                      el.style.position = el.dataset.kryptoPosition || '';
                      el.style.left = el.dataset.kryptoLeft || '';
                      el.style.top = el.dataset.kryptoTop || '';
                      el.style.zIndex = el.dataset.kryptoZ || '';
                      delete el.dataset.kryptoChaos;
                  });
              }
              function scrambleLayout () {
                  const selectors = ['.menu-bar','.blocklyToolboxDiv','.blocklyFlyout','.blocklyWorkspace','.stage-wrapper','.monitor_wrapper','.controls-container','.gui-tab'];
                  const nodes = selectors.flatMap(sel => [...document.querySelectorAll(sel)]).filter((el,i,a)=>a.indexOf(el)===i);
                  nodes.forEach(el => {
                      if (!el.dataset.kryptoChaos) {
                          el.dataset.kryptoChaos='1'; el.dataset.kryptoTransform=el.style.transform;
                          el.dataset.kryptoPosition=el.style.position; el.dataset.kryptoLeft=el.style.left;
                          el.dataset.kryptoTop=el.style.top; el.dataset.kryptoZ=el.style.zIndex;
                      }
                      el.style.transform=`translate(${Math.round(Math.random()*180-90)}px,${Math.round(Math.random()*130-65)}px) rotate(${Math.round(Math.random()*24-12)}deg) scale(${(.8+Math.random()*.45).toFixed(2)})`;
                      el.style.zIndex=String(100+Math.floor(Math.random()*500));
                  });
              }
              function addModesButton () {
                  if (document.getElementById('krypto-modes-trigger')) return;
                  const bar = document.querySelector('.menu-bar');
                  if (!bar) return;
                  const button = document.createElement('button');
                  button.id = 'krypto-modes-trigger';
                  button.type = 'button';
                  button.textContent = 'Modes ▾';
                  button.setAttribute('aria-haspopup', 'menu');
                  Object.assign(button.style, {height:'36px',margin:'0 4px',padding:'0 12px',border:0,borderRadius:'4px',
                      background:'transparent',color:'#fff',font:'500 13px Arial,sans-serif',cursor:'pointer',whiteSpace:'nowrap'});
                  button.addEventListener('mouseenter', () => { button.style.background='rgba(0,0,0,.13)'; });
                  button.addEventListener('mouseleave', () => { button.style.background='transparent'; });
                  button.addEventListener('click', openPanel);
                  const language = bar.querySelector('.menu-bar_language-selector, [class*="language-selector"], [aria-label*="Language"], [title*="Language"]');
                  if (language && language.parentNode) language.parentNode.insertBefore(button, language.nextSibling);
                  else bar.appendChild(button);
              }
              function openPanel () {
                  const old = document.getElementById('krypto-modes-panel');
                  if (old) { old.remove(); return; }
                  const panel = document.createElement('section');
                  panel.id = 'krypto-modes-panel';
                  const trigger = document.getElementById('krypto-modes-trigger');
                  const rect = trigger ? trigger.getBoundingClientRect() : {bottom:54,left:12,right:120};
                  Object.assign(panel.style, {position:'fixed',top:(rect.bottom+6)+'px',left:Math.max(8,Math.min(window.innerWidth-316,rect.left))+'px',width:'300px',zIndex:999998,
                      background:'#fff',color:'#222',padding:'16px',borderRadius:'8px',boxShadow:'0 8px 32px #0005',font:'14px Arial'});
                  panel.innerHTML = '<h3 style="margin:0 0 12px">Experimental Modes</h3>' +
                      '<label style="display:flex;gap:8px;margin:12px 0"><input id="krng" type="checkbox"> RNG Mode</label>' +
                      '<p style="color:#555">When enabled, every toolbox block starts locked. Each roll unlocks one random block type.</p>' +
                      '<button id="kroll" style="padding:8px 12px">Roll to unlock</button><hr style="margin:14px 0">' +
                      '<label style="display:flex;gap:8px;margin:12px 0"><input id="kprogress" type="checkbox"> Progress Detected</label>' +
                      '<p style="color:#555">Randomly removes a top-level block. Ctrl+Z restores it.</p><hr style="margin:14px 0">' +
                      '<button id="krevert" style="padding:8px 12px">Revert All</button> ' +
                      '<button id="kreset" style="padding:8px 12px">Reset Chaos</button> ' +
                      '<button id="kclose" style="padding:8px 12px">Close</button>';
                  document.body.appendChild(panel);
                  panel.querySelector('#krng').checked = state.rng;
                  panel.querySelector('#kprogress').checked = state.progress;
                  panel.querySelector('#krng').addEventListener('change', e => {
                      state.rng = e.target.checked;
                      state.unlocked = state.rng ? [] : allBlockTypes.slice();
                      save(); refreshLocks();
                  });
                  panel.querySelector('#kprogress').addEventListener('change', e => { state.progress = e.target.checked; save(); });
                  panel.querySelector('#kroll').addEventListener('click', () => {
                      collectTypes();
                      const locked = allBlockTypes.filter(type => !state.unlocked.includes(type));
                      if (!locked.length) return toast('All toolbox blocks are unlocked.');
                      const chosen = locked[Math.floor(Math.random() * locked.length)];
                      state.unlocked.push(chosen); save(); refreshLocks();
                      toast('Unlocked block type: ' + chosen);
                  });
                  panel.querySelector('#krevert').addEventListener('click', () => {
                      const ws=getWorkspace();
                      if (ws && window.Blockly && Blockly.Xml) {
                          deletedBlocks.splice(0).forEach(xml => { try { Blockly.Xml.domToBlock(Blockly.Xml.textToDom(xml), ws); } catch (e) { console.warn('Could not restore deleted block',e); } });
                      }
                      resetChaos(); toast('Revert All complete.');
                  });
                  panel.querySelector('#kreset').addEventListener('click', resetChaos);
                  panel.querySelector('#kclose').addEventListener('click', () => panel.remove());
              }
              window.addEventListener('scratch-open-modes', openPanel);
              const menuObserver = new MutationObserver(addModesButton);
              menuObserver.observe(document.documentElement, {childList:true,subtree:true});
              window.addEventListener('load', addModesButton);
              addModesButton();
              window.addEventListener('scratch-chaos', () => {
                  document.body.classList.add('krypto-chaos');
                  if (chaosTimer) clearInterval(chaosTimer);
                  scrambleLayout(); chaosTimer=setInterval(scrambleLayout, 900);
                  toast('ENDLESS SUFFERING AND DESPAIR — Reset Chaos or press Escape to restore the interface.');
              });
              document.addEventListener('scratch-workspace-ready', () => { attachWorkspace(); refreshLocks(); });
              document.addEventListener('keydown', event => { if (event.key === 'Escape') resetChaos(); });
              const observer = new MutationObserver(() => { attachWorkspace(); refreshLocks(); });
              observer.observe(document.documentElement, {childList:true, subtree:true});
              const style = document.createElement('style');
              style.textContent = `
                body.krypto-chaos .menu-bar { animation:krypto-wobble .22s infinite alternate !important; filter:hue-rotate(145deg) contrast(1.7) !important; }
                body.krypto-chaos .blocklyWorkspace { animation:krypto-wobble .17s infinite alternate !important; filter:hue-rotate(220deg) saturate(3) !important; }
                body.krypto-chaos .stage-wrapper { transform:rotate(1.5deg) scale(.97); filter:invert(.12) hue-rotate(80deg); }
                @keyframes krypto-flesh-pulse { from { transform:scale(.82) rotate(-8deg); border-radius:35% 55% 42% 60%; } to { transform:scale(1.16) rotate(9deg); border-radius:55% 35% 60% 42%; } }
                @keyframes krypto-wobble { from { transform:translate(0,0) rotate(-.4deg); } to { transform:translate(3px,-2px) rotate(.5deg); } }
              `;
              document.head.appendChild(style);
              window.addEventListener('load', () => { attachWorkspace(); refreshLocks(); });
          })();
          ''', encoding='utf-8')
          
          print('Zany Blocks and Hidden Blocks customizations installed.')
          print('Default sprite:', sprite.get('name', 'Sprite1'))
          print('Sprite assets:', len(items))
          PY

      - name: Build Scratch GUI
        working-directory: scratch-gui-src
        run: npm run build

      - name: Prepare website
        run: |
          cp scratch-gui-src/custom-extension.js scratch-gui-src/build/custom-extension.js
          cp scratch-gui-src/custom-modes.js scratch-gui-src/build/custom-modes.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scratch-gui-src/build/index.html')
          html = p.read_text(encoding='utf-8')
          if 'custom-modes.js' not in html:
              html = html.replace('</body>', '<script src="./custom-modes.js"></script>\n</body>')
          p.write_text(html, encoding='utf-8')
          PY
          mkdir -p site/editor
          cp index.html site/index.html
          cp -R scratch-gui-src/build/. site/editor/
          touch site/.nojekyll site/editor/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
