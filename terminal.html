<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NR_0S // TERMINAL</title>
<script>
(function () {
    let allowed = false;
    try {
        allowed = sessionStorage.getItem('terminal_access') === 'granted';
    } catch (error) {
        allowed = false;
    }
    if (!allowed) document.documentElement.classList.add('access-denied');
})();
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #000; color: #00ff55; }
body { font-family: "Courier New", monospace; padding: 22px; }
#terminal { max-width: 1000px; margin: 0 auto; }
.topbar { display: flex; justify-content: space-between; gap: 20px; color: #00ff55; border-bottom: 1px solid #087a2c; padding-bottom: 10px; }
#output { min-height: 55vh; padding: 18px 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.line { margin: 0 0 5px; }
.dim { color: #16883b; }
.error { color: #ff5555; }
#entryline { display: flex; align-items: center; gap: 9px; border-top: 1px solid #087a2c; padding-top: 12px; }
#command { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #00ff55; font: inherit; caret-color: #00ff55; }
#duck-image { display: block; max-width: min(100%, 480px); max-height: 300px; object-fit: contain; margin: 12px 0; border: 1px solid #16883b; }
#denied { display: none; min-height: calc(100vh - 44px); align-items: center; justify-content: center; text-align: center; }
#denied h1 { letter-spacing: 4px; }
#denied p { color: #78b88a; }
#denied a { color: #00ff55; }
html.access-denied #terminal { display: none; }
html.access-denied #denied { display: flex; }
@media (max-width: 600px) { body { padding: 14px; } .topbar { font-size: 13px; } }
</style>
</head>
<body>
<div id="denied">
  <div>
    <h1>ACCESS DENIED</h1>
    <p>YOU MUST ENTER THROUGH THE MAIN ARCHIVE.</p>
    <a href="index.html">[ RETURN TO INDEX ]</a>
  </div>
</div>

<div id="terminal">
  <div class="topbar"><span>NR_0S // ARCHIVE INTERFACE</span><span>LOCAL NODE: ACTIVE</span></div>
  <div id="output" aria-live="polite"></div>
  <form id="entryline" autocomplete="off">
    <span>&gt;_</span>
    <input id="command" type="text" spellcheck="false" autocomplete="off" autofocus aria-label="Terminal command">
  </form>
</div>

<script>
(function () {
    if (document.documentElement.classList.contains('access-denied')) return;

    const output = document.getElementById('output');
    const form = document.getElementById('entryline');
    const input = document.getElementById('command');
    let locked = false;

    function line(text, className) {
        const row = document.createElement('div');
        row.className = 'line' + (className ? ' ' + className : '');
        row.textContent = text;
        output.appendChild(row);
        output.scrollTop = output.scrollHeight;
    }

    function showRecord(id) {
        const records = {
            '1444': ['RECORD 1444', 'FIRST REFERENCE: UNCONFIRMED', 'The archive contains a date, but no readable document.'],
            '1946': ['RECORD 1946', 'N0IR DESIGNATION REGISTERED.', 'The name appears in the archive for the first time.'],
            '1950': ['RECORD 1950', 'STATUS: SIGNIFICANT', 'N0IR begins appearing in records connected to the popularization of computers.'],
            '2002': ['RECORD 2002', 'STATUS: FRAGMENTED', 'A public-facing archive was detected. Several records remain inaccessible.'],
            '????': ['RECORD ????', 'DATE: CORRUPTED', 'This record has no reliable timestamp.']
        };
        (records[id] || ['RECORD NOT FOUND.', 'No matching archive record exists.']).forEach(t => line(t));
    }

    function duck() {
        line('REQUESTING RANDOM WATERFOWL IMAGE...');
        const img = document.createElement('img');
        img.id = 'duck-image';
        img.alt = 'A randomly selected rubber duck';
        img.src = 'https://loremflickr.com/640/480/rubberduck?lock=' + Math.floor(Math.random() * 1000000);
        img.onerror = () => line('IMAGE REQUEST FAILED. EXTERNAL ARCHIVE UNAVAILABLE.', 'error');
        output.appendChild(img);
        const link = document.createElement('a');
        link.href = 'https://www.google.com/search?tbm=isch&q=rubber+duck';
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '[ SEARCH RUBBER DUCK IMAGES ]';
        link.style.color = '#00ff55';
        output.appendChild(link);
    }

    function execute(raw) {
        const command = raw.trim();
        if (!command) return;
        line('> ' + command);
        const upper = command.toUpperCase();
        if (upper === 'HELP') {
            line('AVAILABLE COMMANDS: HELP, STATUS, ABOUT, ARCHIVES, HISTORY, CONNECT, CLEAR, EXIT, DUCK, OPEN [RECORD]');
        } else if (upper === 'STATUS') {
            line('SYSTEM: NR_0S');
            line('ARCHIVE CONNECTION: UNSTABLE');
            line('ACCESS LEVEL: GUEST');
        } else if (upper === 'ABOUT') {
            line('NR_0S IS THE LOCAL ARCHIVE INTERFACE.');
            line('FIRST KNOWN N0IR DESIGNATION: 1946.');
        } else if (upper === 'ARCHIVES') {
            line('AVAILABLE RECORDS: 1444, 1946, 1950, 2002, ????');
        } else if (upper === 'HISTORY') {
            line('1444  // FIRST KNOWN EXISTENCE');
            line('1946  // N0IR NAME REGISTERED');
            line('1950  // COMPUTER-AGE ACTIVITY');
            line('2002  // PUBLIC ARCHIVE FRAGMENT');
        } else if (upper === 'CONNECT') {
            line('ATTEMPTING SECONDARY CONNECTION...');
            setTimeout(() => line('CONNECTION ESTABLISHED. NO FURTHER DATA RECEIVED.'), 700);
        } else if (upper === 'CLEAR') {
            output.replaceChildren();
        } else if (upper === 'EXIT') {
            window.location.href = 'index.html';
        } else if (upper === 'DUCK') {
            duck();
        } else if (upper.startsWith('OPEN ')) {
            showRecord(command.slice(5).trim());
        } else {
            line('UNKNOWN COMMAND. TYPE HELP.', 'error');
        }
    }

    const startup = [
        'NR_0S SYSTEM INITIALIZED.',
        'CHECKING LOCAL ARCHIVES...',
        'ARCHIVE CONNECTION: UNSTABLE',
        'LOADING RECORD 1444...',
        'RECORD NOT FOUND.',
        'ATTEMPTING SECONDARY CONNECTION...',
        'CONNECTION ESTABLISHED.',
        'WELCOME BACK.',
        'TYPE HELP TO VIEW AVAILABLE COMMANDS.'
    ];
    startup.forEach((message, index) => setTimeout(() => line(message), index * 180));

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (locked) return;
        const value = input.value;
        input.value = '';
        execute(value);
    });

    // The shutdown phrase interrupts while it is being typed; it never shuts down the device.
    input.addEventListener('input', function () {
        if (input.value.trim().toLowerCase() === 'shutdown') {
            locked = true;
            document.body.innerHTML = '<div style="min-height:100vh;background:#000;color:#00ff55;display:flex;align-items:center;justify-content:center;font:32px Courier New,monospace;">you cant.</div>';
        }
    });
})();
</script>
</body>
</html>
