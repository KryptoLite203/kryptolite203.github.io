
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f80c9">
  <title>404 - Blueyfans Rather Odd Scratch Editor Of Zany Mystery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d9efff;
      color: #24384b;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 38px 30px 32px;
      text-align: center;
      background: #ffffff;
      border: 3px solid #75b8e8;
      border-radius: 12px;
      box-shadow: 5px 6px 0 #a9d5f2;
    }

    h1 {
      margin: 0 auto 18px;
      color: #246eae;
      font-size: clamp(55px, 10vw, 85px);
      line-height: 1.18;
    }

    h2 {
      color: #246eae;
      margin: 0 0 18px;
      font-size: 25px;
    }

    .subtitle {
      max-width: 510px;
      margin: 0 auto 28px;
      color: #526b7e;
      font-size: 17px;
      line-height: 1.5;
    }

    .launch {
      display: inline-block;
      padding: 13px 25px;
      border: 2px solid #1e659f;
      border-radius: 8px;
      background: #398bd0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 0 #1e659f;
      transition: background-color 120ms ease,
                  transform 120ms ease,
                  box-shadow 120ms ease;
    }

    .launch:hover {
      background: #2679bd;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e659f;
    }

    .launch:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .footer {
      margin-top: 28px;
      color: #7892a6;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      main {
        padding: 30px 18px 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>404</h1>
    <h2>Well, this is awkward.</h2>

    <p class="subtitle">
      sup, the servers are either down or I gave up on
      the page you tried to go to.
    </p>

    <a class="launch" href="/">
      Click this to go back to the main page &raquo;
    </a>

    <div class="footer">
      Blueyfans Rather Odd Scratch Editor Of Zany Mystery
    </div>
  </main>
</body>
</html>
